<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>LiftLab • Gym Tracker</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0fa;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1150px;margin:auto;padding:24px 18px 100px}.top,.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:24px;font-weight:850;letter-spacing:-1px}.brand b{color:#8eabff}.muted{color:#93a1b8;font-size:13px}.tabs{display:flex;gap:7px;overflow:auto;margin:24px 0}.tabs button{background:#17223a;color:#aebcd1;padding:12px 17px;border-radius:12px;white-space:nowrap}.tabs button.active,.primary{background:#6487fa!important;color:white!important}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#141e31;border:1px solid #26344b;border-radius:19px;padding:19px;margin-bottom:15px}.metric{font-size:28px;font-weight:800;margin:10px 0 4px}.section{font-size:19px;font-weight:800;margin:0 0 15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.primary,.secondary,.danger{border-radius:11px;padding:11px 15px;font-weight:700}.secondary{background:#273752;color:#e6edfc}.danger{background:#482635;color:#ffc6d0}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:13px;color:#b7c6dc}input,select{width:100%;background:#0c1527;color:#f2f5ff;border:1px solid #354761;border-radius:10px;padding:11px;min-width:0}input:focus,select:focus{outline:2px solid #6487fa}label{font-size:13px}.exercise{padding:15px;border:1px solid #2b3b55;border-radius:15px;margin:12px 0;background:#101a2d}.setrow{display:grid;grid-template-columns:38px 1fr 1fr 42px;gap:8px;align-items:end;margin:8px 0}.setrow input{padding:9px}.pill{display:inline-block;background:#263754;border-radius:99px;padding:5px 9px;color:#b7cbff;font-size:12px}.listrow{padding:12px 0;border-bottom:1px solid #2b3850}.listrow:last-child{border:0}.hidden{display:none!important}.muscles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bodymap{width:100%;max-height:320px}.bodymap path,.bodymap ellipse,.bodymap rect{stroke:#0d1626;stroke-width:3;transition:fill .2s}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#b6c4d9}.swatch{width:12px;height:12px;border-radius:3px;display:inline-block}.chart{width:100%;height:180px}.notice{padding:12px;border-radius:12px;background:#1b2d48;color:#bfd4ff;font-size:13px}.empty{color:#93a1b8;text-align:center;padding:25px}.mini{font-size:12px;color:#93a1b8}.tag{color:#90e6c2}.user-tools{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.user-tools .field{margin:0;min-width:150px}.user-tools select{padding:9px}.user-badge{display:inline-block;margin-top:6px;color:#b7cbff;font-size:12px}.macro-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.macro-box{background:#172237;border:1px solid #354761;border-radius:12px;padding:12px}.macro-box b{display:block;font-size:19px}.macro-p{color:#73e6a9}.macro-c{color:#f4c86a}.macro-f{color:#ff9b91}.macro-k{color:#92adff}@media(max-width:560px){.macro-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}svg text{fill:#a9b9d1;font-size:11px} @media(max-width:750px){.top{align-items:flex-start;flex-direction:column}.user-tools{width:100%}.user-tools .field{flex:1}.user-tools button{padding:10px 12px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.app{padding:16px 12px 80px}.metric{font-size:24px}.card{padding:15px}.tabs{margin:17px 0}.three{grid-template-columns:1fr 1fr}} </style></head><body><main class="app"><header class="top"><div><div class="brand">LIFT<b>LAB</b> <span style="font-size:13px;color:#8a9bb8">TRACKER</span></div><div class="muted">Build strength. Track progress.</div></div><div class="user-tools"><label class="field">User aktif<select id="userSelect" onchange="switchUser(this.value)"></select></label><button class="secondary" onclick="addUser()">+ User</button><button class="secondary" onclick="renameUser()">Ubah nama</button><button class="danger" onclick="deleteUser()">Hapus</button><button class="secondary" onclick="exportData()">Backup ↓</button></div></header><nav class="tabs" id="tabs"></nav><div id="page"></div></main><script>
const LEGACY_KEY='liftlab_v1',USERS_KEY='liftlab_users_v2',ACTIVE_USER_KEY='liftlab_active_user_v2';
const today=()=>new Date().toLocaleDateString('en-CA');const uid=()=>Math.random().toString(36).slice(2);const fmt=n=>Math.round(n||0).toLocaleString('id-ID');const exercises=[['Bench Press','Dada'],['Incline Dumbbell Press','Dada'],['Chest Fly','Dada'],['Push Up','Dada'],['Lat Pulldown','Punggung'],['Barbell Row','Punggung'],['Seated Cable Row','Punggung'],['Pull Up','Punggung'],['Shoulder Press','Bahu'],['Lateral Raise','Bahu'],['Rear Delt Fly','Bahu'],['Bicep Curl','Bisep'],['Hammer Curl','Bisep'],['Tricep Pushdown','Trisep'],['Skull Crusher','Trisep'],['Squat','Quadriceps'],['Leg Press','Quadriceps'],['Leg Extension','Quadriceps'],['Romanian Deadlift','Hamstring'],['Leg Curl','Hamstring'],['Hip Thrust','Glutes'],['Calf Raise','Betis'],['Crunch','Core'],['Plank','Core'],['Deadlift','Punggung']];const groups=['Dada','Punggung','Bahu','Bisep','Trisep','Quadriceps','Hamstring','Glutes','Betis','Core'];
function defaultDB(){return {profile:{height:168,weight:75,target:68,gender:'male',age:25,activity:1.375,goalDays:60},weights:[],sessions:[],foodLog:[],foodCustom:[],calorieGoal:2000}}
function safeName(n){return String(n||'User').trim().slice(0,40)}
function userKey(id){return 'liftlab_user_'+id}
function getUsers(){try{let a=JSON.parse(localStorage.getItem(USERS_KEY));return Array.isArray(a)?a:[]}catch{return []}}
function setUsers(a){localStorage.setItem(USERS_KEY,JSON.stringify(a))}
function normalizeDB(d){d=d&&typeof d==='object'?d:defaultDB();d.profile=d.profile||defaultDB().profile;d.weights=Array.isArray(d.weights)?d.weights:[];d.sessions=Array.isArray(d.sessions)?d.sessions:[];d.foodLog=Array.isArray(d.foodLog)?d.foodLog:[];d.foodCustom=Array.isArray(d.foodCustom)?d.foodCustom:[];d.calorieGoal=d.calorieGoal||2000;d.profile.gender=d.profile.gender||'male';d.profile.age=d.profile.age||25;d.profile.activity=d.profile.activity||1.375;d.profile.goalDays=d.profile.goalDays||60;return d}
function initUsers(){let users=getUsers();if(!users.length){let id=uid(),legacy=null;try{legacy=JSON.parse(localStorage.getItem(LEGACY_KEY))}catch{}users=[{id,name:'Marcello'}];setUsers(users);localStorage.setItem(userKey(id),JSON.stringify(normalizeDB(legacy||defaultDB())));localStorage.setItem(ACTIVE_USER_KEY,id)}let active=localStorage.getItem(ACTIVE_USER_KEY);if(!users.some(u=>u.id===active)){active=users[0].id;localStorage.setItem(ACTIVE_USER_KEY,active)}return {users,active}}
let userState=initUsers(),activeUserId=userState.active,db=loadUserData();
function loadUserData(){try{return normalizeDB(JSON.parse(localStorage.getItem(userKey(activeUserId)))||defaultDB())}catch{return defaultDB()}}
function save(){localStorage.setItem(userKey(activeUserId),JSON.stringify(db))}
function activeUser(){return getUsers().find(u=>u.id===activeUserId)||getUsers()[0]}
function populateUsers(){let el=document.getElementById('userSelect');if(!el)return;el.innerHTML=getUsers().map(u=>`<option value="${u.id}" ${u.id===activeUserId?'selected':''}>${esc(u.name)}</option>`).join('')}
function switchUser(id){save();activeUserId=id;localStorage.setItem(ACTIVE_USER_KEY,id);db=loadUserData();draft=[];date=today();foodDate=today();foodSearch='';foodPick=0;tab='Dashboard';render()}
function addUser(){let name=safeName(prompt('Masukkan nama user baru'));if(!name)return;let users=getUsers();if(users.some(u=>u.name.toLocaleLowerCase('id')===name.toLocaleLowerCase('id')))return alert('Nama user sudah digunakan');let id=uid();users.push({id,name});setUsers(users);localStorage.setItem(userKey(id),JSON.stringify(defaultDB()));switchUser(id)}
function renameUser(){let u=activeUser();if(!u)return;let name=safeName(prompt('Masukkan nama baru',u.name));if(!name)return;let users=getUsers();if(users.some(x=>x.id!==u.id&&x.name.toLocaleLowerCase('id')===name.toLocaleLowerCase('id')))return alert('Nama user sudah digunakan');u.name=name;setUsers(users.map(x=>x.id===u.id?u:x));render()}
function deleteUser(){let users=getUsers(),u=activeUser();if(users.length<=1)return alert('Minimal harus ada satu user');if(!confirm(`Hapus user ${u.name} beserta seluruh datanya?`))return;localStorage.removeItem(userKey(u.id));users=users.filter(x=>x.id!==u.id);setUsers(users);activeUserId=users[0].id;localStorage.setItem(ACTIVE_USER_KEY,activeUserId);db=loadUserData();draft=[];tab='Dashboard';render()}const vol=s=>s.exercises.reduce((a,e)=>a+e.sets.reduce((b,t)=>b+(+t.kg||0)*(+t.reps||0),0),0);const sets=s=>s.exercises.reduce((a,e)=>a+e.sets.length,0);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(t){tab=t;render()}function render(){populateUsers();document.getElementById('tabs').innerHTML=['Dashboard','Workout','Muscle Map','Body Progress','Kalori','History','Settings'].map(t=>`<button class="${tab===t?'active':''}" onclick="nav('${t}')">${t}</button>`).join('');document.getElementById('page').innerHTML=({Dashboard:dashboard,Workout:workout,'Muscle Map':musclePage,'Body Progress':bodyPage,Kalori:caloriePage,History:history,Settings:settings})[tab]()}function stat(label,val,sub){return `<div class="card"><div class="muted">${label}</div><div class="metric">${val}</div><div class="mini">${sub}</div></div>`}function dashboard(){let now=new Date(),start=new Date(now);start.setDate(now.getDate()-6);let week=db.sessions.filter(s=>new Date(s.date+'T12:00:00')>=new Date(start.toDateString()));let total=week.reduce((a,s)=>a+vol(s),0);let bmi=db.profile.weight/(db.profile.height/100)**2;let last=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `<div class="between"><div><h2 style="margin-bottom:2px">Overview</h2><span class="user-badge">Data milik ${esc(activeUser().name)}</span></div><button class="primary" onclick="nav('Workout')">+ Log Workout</button></div><div class="grid">${stat('Volume 7 hari',fmt(total)+' kg','Total beban × repetisi')}${stat('Sesi 7 hari',week.length,'Workout tersimpan')}${stat('Total set',week.reduce((a,s)=>a+sets(s),0),'Dalam 7 hari')}${stat('BMI',bmi.toFixed(1),'Berat '+db.profile.weight+' kg')}</div><div class="two"><section class="card"><h3 class="section">Volume 7 hari terakhir</h3>${barChart(7)}</section><section class="card"><h3 class="section">Recent workouts</h3>${last.length?last.map(s=>`<div class="listrow between"><div><b>${esc(s.date)}</b><div class="mini">${s.exercises.length} exercise · ${sets(s)} sets</div></div><b>${fmt(vol(s))} kg</b></div>`).join(''):'<div class="empty">Belum ada latihan. Mulai dari Workout!</div>'}</section></div><div class="notice">Tips: gunakan tombol “Salin sesi terakhir” di Workout untuk melanjutkan latihan dan memantau progressive overload.</div>`}function barChart(n){let days=Array.from({length:n},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(n-1-i));let k=d.toLocaleDateString('en-CA');return {k,v:db.sessions.filter(s=>s.date===k).reduce((a,s)=>a+vol(s),0)}}),max=Math.max(1,...days.map(x=>x.v));return `<div style="display:flex;align-items:end;height:185px;gap:9px;border-bottom:1px solid #354761">${days.map(x=>`<div style="flex:1;min-width:0;text-align:center"><div class="mini">${x.v?fmt(x.v):''}</div><div style="height:${Math.max(3,x.v/max*135)}px;background:linear-gradient(#8eabff,#526ce2);border-radius:7px 7px 0 0"></div><div class="mini" style="padding-top:6px">${x.k.slice(5)}</div></div>`).join('')}</div>`}function addExercise(){let sel=document.getElementById('exSelect').value;if(sel==='custom'){let name=document.getElementById('customName').value.trim();if(!name)return alert('Isi nama latihan');draft.push({id:uid(),name,muscle:document.getElementById('customMuscle').value,sets:[{kg:0,reps:10}]})}else{let [name,muscle]=exercises[+sel];draft.push({id:uid(),name,muscle,sets:[{kg:0,reps:10}]})}render()}function addSet(id){let e=draft.find(x=>x.id===id);e.sets.push({...e.sets.at(-1)});render()}function delSet(id,i){let e=draft.find(x=>x.id===id);e.sets.splice(i,1);render()}function updateSet(id,i,k,v){draft.find(x=>x.id===id).sets[i][k]=Math.max(0,+v||0);let el=document.getElementById('draftVolume');if(el)el.textContent=fmt(vol({exercises:draft}))+' kg'}function removeEx(id){draft=draft.filter(x=>x.id!==id);render()}function copyLast(){let last=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date))[0];if(!last)return alert('Belum ada sesi sebelumnya');draft=structuredClone(last.exercises).map(e=>({...e,id:uid()}));render()}function copySelected(){let source=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date))[0];if(!source)return alert('Belum ada sesi sebelumnya');let chosen=[...document.querySelectorAll('.copy-ex:checked')].map(x=>+x.value);if(!chosen.length)return alert('Pilih minimal satu latihan');let selected=source.exercises.filter((e,i)=>chosen.includes(i)).map(e=>({...structuredClone(e),id:uid()}));draft.push(...selected);render()}function workout(){let total=vol({exercises:draft});let source=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date))[0];return `<div class="between"><h2>Workout Logger</h2><button class="secondary" onclick="copyLast()">↻ Salin sesi terakhir</button></div>${source?`<div class="card"><h3 class="section">Salin latihan pilihan dari ${source.date}</h3><p class="muted">Centang hanya latihan yang kamu lakukan hari ini. Latihan lain tidak akan disalin.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px">${source.exercises.map((e,i)=>`<label style="display:flex;gap:9px;align-items:center;background:#1b2940;padding:12px;border-radius:10px;cursor:pointer"><input type="checkbox" class="copy-ex" value="${i}" style="width:18px;height:18px"><span><b>${esc(e.name)}</b><div class="mini">${esc(e.muscle)} · ${e.sets.length} set</div></span></label>`).join('')}</div><button class="primary" onclick="copySelected()">+ Salin latihan terpilih</button></div>`:''}<div class="card"><div class="two"><label class="field">Tanggal latihan<input type="date" value="${date}" onchange="date=this.value"></label><label class="field">Pilih latihan<select id="exSelect" onchange="document.getElementById('customBox').classList.toggle('hidden',this.value!=='custom')">${exercises.map((e,i)=>`<option value="${i}">${e[0]} · ${e[1]}</option>`).join('')}<option value="custom">+ Latihan custom</option></select></label></div><div id="customBox" class="hidden"><div class="two"><label class="field">Nama latihan<input id="customName" placeholder="Contoh: Pec Deck"></label><label class="field">Otot utama<select id="customMuscle">${groups.map(g=>`<option>${g}</option>`).join('')}</select></label></div></div><button class="primary" onclick="addExercise()">+ Tambah exercise</button></div>${draft.map(e=>`<div class="exercise"><div class="between"><div><b>${esc(e.name)}</b> <span class="pill">${e.muscle}</span></div><button class="danger" onclick="removeEx('${e.id}')">Hapus</button></div>${e.sets.map((s,i)=>`<div class="setrow"><span class="muted">#${i+1}</span><label class="field" style="margin:0">Beban (kg)<input type="number" min="0" step="0.5" value="${s.kg}" oninput="updateSet('${e.id}',${i},'kg',this.value)"></label><label class="field" style="margin:0">Reps<input type="number" min="0" value="${s.reps}" oninput="updateSet('${e.id}',${i},'reps',this.value)"></label><button class="danger" onclick="delSet('${e.id}',${i})">×</button></div>`).join('')}<button class="secondary" onclick="addSet('${e.id}')">+ Set</button>${previous(e)}</div>`).join('')}<div class="card between"><div><div class="muted">Total volume sesi</div><div class="metric" id="draftVolume">${fmt(total)} kg</div></div><button class="primary" onclick="finish()">Simpan sesi ✓</button></div>`}function previous(e){let matches=db.sessions.flatMap(s=>s.exercises.filter(x=>x.name===e.name).map(x=>({...x,date:s.date}))).sort((a,b)=>b.date.localeCompare(a.date));if(!matches.length)return '';let p=matches[0];return `<div class="mini" style="margin-top:10px">Sesi sebelumnya (${p.date}): ${p.sets.map(s=>s.kg+'kg × '+s.reps).join(' · ')}</div>`}function finish(){if(!draft.length)return alert('Tambahkan minimal satu latihan');if(!date)return alert('Pilih tanggal');db.sessions.push({id:uid(),date,exercises:structuredClone(draft)});save();draft=[];nav('Dashboard')}function scores(){let d=new Date();d.setDate(d.getDate()-27);let s={};groups.forEach(g=>s[g]=0);db.sessions.filter(x=>new Date(x.date+'T12:00:00')>=new Date(d.toDateString())).forEach(x=>x.exercises.forEach(e=>{s[e.muscle]=(s[e.muscle]||0)+e.sets.length}));return s}function color(n,max){if(!n)return '#26354d';let a=Math.max(.25,n/Math.max(1,max));return `rgb(${Math.round(45+190*a)},${Math.round(80+40*(1-a))},${Math.round(125-60*a)})`}function figure(back,s,max){let part=(tag,attr,g)=>`<${tag} ${attr} fill="${color(s[g],max)}"><title>${g}: ${s[g]} set</title></${tag}>`;return `<svg class="bodymap" viewBox="0 0 180 310" role="img" aria-label="Peta otot ${back?'belakang':'depan'}"><ellipse cx="90" cy="24" rx="21" ry="23" fill="#43516b"/><rect x="82" y="44" width="16" height="12" rx="3" fill="#43516b"/>${part('ellipse','cx="57" cy="76" rx="17" ry="20"','Bahu')}${part('ellipse','cx="123" cy="76" rx="17" ry="20"','Bahu')}${part('path',`d="M72 56 L108 56 L111 111 L100 141 L80 141 L69 111 Z"`,back?'Punggung':'Dada')}${!back?part('path','d="M79 109 L101 109 L105 157 L75 157 Z"','Core'):part('path','d="M79 136 L101 136 L109 164 L71 164 Z"','Glutes')}${part('path','d="M41 93 L58 97 L51 151 L35 146 Z"',back?'Trisep':'Bisep')}${part('path','d="M122 97 L139 93 L145 146 L129 151 Z"',back?'Trisep':'Bisep')}<path d="M35 150 L51 153 L48 200 L30 198 Z" fill="#43516b"/><path d="M129 153 L145 150 L150 198 L132 200 Z" fill="#43516b"/>${part('path','d="M71 158 L90 163 L86 235 L64 235 Z"',back?'Hamstring':'Quadriceps')}${part('path','d="M90 163 L109 158 L116 235 L94 235 Z"',back?'Hamstring':'Quadriceps')}${part('path','d="M65 240 L85 240 L82 291 L69 291 Z"','Betis')}${part('path','d="M95 240 L115 240 L111 291 L98 291 Z"','Betis')}<text x="90" y="307" text-anchor="middle">${back?'BELAKANG':'DEPAN'}</text></svg>`}function musclePage(){let s=scores(),max=Math.max(1,...Object.values(s));return `<h2>Muscle Activity</h2><p class="muted">Heatmap berdasarkan jumlah set dalam 28 hari terakhir. Semakin terang, semakin banyak set tercatat. Ini bukan pengukuran aktivasi otot secara langsung.</p><div class="two"><div class="card"><div class="muscles">${figure(false,s,max)}${figure(true,s,max)}</div><div class="legend"><span><i class="swatch" style="background:#26354d"></i> Belum dilatih</span><span><i class="swatch" style="background:#a65765"></i> Intensitas relatif tinggi</span></div></div><div class="card"><h3 class="section">Volume set per kelompok otot</h3>${Object.entries(s).sort((a,b)=>b[1]-a[1]).map(([g,n])=>`<div style="margin:12px 0"><div class="between"><span>${g}</span><b>${n} set</b></div><div style="height:8px;background:#25334a;border-radius:9px;margin-top:6px"><div style="height:100%;width:${n/max*100}%;background:${color(n,max)};border-radius:9px"></div></div></div>`).join('')}</div></div>`}function bmiCategory(b){return b<18.5?'Underweight':b<25?'Normal':b<30?'Overweight':'Obesitas'}function bodyPage(){let p=db.profile,b=p.weight/(p.height/100)**2,weights=[...db.weights].sort((a,b)=>a.date.localeCompare(b.date));return `<h2>Body Progress</h2><div class="grid">${stat('Berat saat ini',p.weight+' kg','Update dari log')}${stat('Target berat',p.target+' kg','Selisih '+(p.weight-p.target).toFixed(1)+' kg')}${stat('BMI',b.toFixed(1),bmiCategory(b))}${stat('Tinggi badan',p.height+' cm','Tersimpan di profil')}</div><div class="two"><div class="card"><h3 class="section">Catat berat badan</h3><label class="field">Tanggal<input id="wDate" type="date" value="${today()}"></label><label class="field">Berat (kg)<input id="wValue" type="number" step="0.1" min="1" value="${p.weight}"></label><button class="primary" onclick="addWeight()">Simpan berat</button><p vity">${[[1.2,'Sedentary (jarang bergerak)'],[1.375,'Ringan (gym 1–3x/minggu)'],[1.55,'Sedang (gym 3–5x/minggu)'],[1.725,'Tinggi (latihan berat 6–7x/minggu)']].map(x=>`<option value="${x[0]}" ${Number(db.profile.activity)===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><label class="field">Durasi mencapai target (hari)<input id="goalDays" type="number" min="7" max="730" value="${db.profile.goalDays}"></label><label class="field">Tinggi badan (cm)<input id="height" type="number" value="${db.profile.height}"></label><label class="field">Berat badan (kg)<input id="weight" type="number" step="0.1" value="${db.profile.weight}"></label><label class="field">Target berat (kg)<input id="target" type="number" step="0.1" value="${db.profile.target}"></label><button class="primary" onclick="saveProfile()">Hitung & simpan profil</button><div class="notice" style="margin-top:14px">Target kalori otomatis berdasarkan BMR Mifflin–St Jeor, aktivitas, dan target berat. Target sangat agresif akan dibatasi dengan batas konservatif (1.500 kkal laki-laki / 1.200 kkal perempuan); ini bukan rekomendasi medis individual.</div></div><div class="card"><h3 class="section">Data & Privasi</h3><p class="muted">Data setiap user disimpan terpisah di localStorage browser pada perangkat ini. Tidak disinkronkan antar perangkat; data dapat hilang jika penyimpanan browser dibersihkan.</p><button class="secondary" onclick="exportData()">Unduh backup JSON</button><label class="field" style="margin-top:15px">Pulihkan backup<input type="file" accept="application/json" onchange="importData(this)"></label><button class="danger" onclick="resetAll()">Reset data user ini</button></div></div>`}function saveProfile(){let height=+document.getElementById('height').value,weight=+document.getElementById('weight').value,target=+document.getElementById('target').value;if(height<80||weight<=0||target<=0)return alert('Periksa nilai profil');let age=+document.getElementById('age').value,goalDays=+document let foodDate=today(),foodSearch='',foodPick=0,foodUnit='porsi',foodQty=1,meal='Makan siang';
function allFoods(){return [...foods,...db.foodCustom]}
function nutrition(f,g){return [f[1],f[2],f[3],f[4]].map(x=>x*g/100)}
function foodSelect(i){foodPick=i;foodQty=1;foodUnit='porsi';render()}
function foodChangeUnit(v){foodUnit=v;foodQty=v==='gram'?allFoods()[foodPick][5]:1;render()}
function addFood(){let f=allFoods()[foodPick],q=+document.getElementById('foodQty').value;if(!(q>0))return alert('Masukkan jumlah positif');let g=foodUnit==='gram'?q:q*f[5],n=nutrition(f,g);db.foodLog.push({id:uid(),date:foodDate,name:f[0],grams:g,meal,cal:n[0],protein:n[1],fat:n[2],carb:n[3]});save();render()}
function removeFood(id){db.foodLog=db.foodLog.filter(x=>x.id!==id);save();render()}
function changeFoodDate(v){foodDate=v;render()}
function changeMeal(v){meal=v}
function foodMatches(name,query){const normalize=t=>String(t||'').normalize('NFKD').toLocaleLowerCase('id').replace(/[^a-z0-9]+/g,' ').trim();const words=normalize(query).split(/\s+/).filter(Boolean);const food=normalize(name);return words.every(word=>food.split(' ').some(token=>token.startsWith(word)))}function searchFood(v){foodSearch=v;render();let e=document.getElementById('foodSearch');if(e){e.focus();e.setSelectionRange(v.length,v.length)}}
function setGoal(){let v=+document.getElementById('calGoal').value;if(v<500||v>10000)return alert('Target 500–10000 kkal');db.calorieGoal=v;save();render()}
function createFood(){let name=document.getElementById('newFoodName').value.trim(),cal=+document.getElementById('newFoodCal').value,p=+document.getElementById('newFoodP').value||0,f=+document.getElementById('newFoodF').value||0,c=+document.getElementById('newFoodC').value||0,grams=+document.getElementById('newFoodServing').value;if(!name||cal<0||p<0||f<0||c<0||!(grams>0))return alert('Lengkapi nama, kalori, protein, karbohidrat, lemak, dan berat porsi dengan nilai valid');db.foodCustom.push([name,cal,p,f,c,grams,'porsi','Input pengguna']);foodPick=allFoods().length-1;save();render()}
function caloriePage(){let cg=calcGoal();let list=allFoods(),f=list[foodPick]||list[0],daily=db.foodLog.filter(x=>x.date===foodDate),sum=k=>daily.reduce((a,x)=>a+(x[k]||0),0),cal=sum('cal'),protein=sum('protein'),carb=sum('carb'),fat=sum('fat'),pct=Math.min(100,cal/db.calorieGoal*100),g=foodUnit==='gram'?foodQty:foodQty*f[5],n=nutrition(f,g),filtered=list.map((x,i)=>({x,i})).filter(o=>foodMatches(o.x[0],foodSearch));return `<div class="between"><h2>Kalori & Nutrisi</h2><input type="date" style="max-width:175px" value="${foodDate}" onchange="changeFoodDate(this.value)"></div><div class="card"><h3 class="section">Kalkulator target kalori</h3><div class="grid">${stat('BMR',fmt(cg.bmr)+' kkal','Energi saat istirahat')}${stat('TDEE',fmt(cg.tdee)+' kkal','Estimasi kebutuhan harian')}${stat('Defisit target',fmt(cg.deficit)+' kkal','Per hari')}${stat('Saran kalori',fmt(cg.goal)+' kkal','Target dengan batas konservatif')}</div><p class="mini">${db.profile.weight} → ${db.profile.target} kg dalam ${db.profile.goalDays} hari · ${cg.weekly.toFixed(2)} kg/minggu (perkiraan linear).</p>${cg.aggressive?'<div class="notice">⚠ Target terlalu agresif atau membutuhkan kalori terlalu rendah. Pertimbangkan memperpanjang durasi; hasil aktual bisa berbeda dari hitungan.</div>':''}<div class="between"><button class="secondary" onclick="nav('Settings')">Ubah profil & target</button><button class="primary" onclick="applyGoal()">Gunakan target ${fmt(cg.goal)} kkal</button></div></div><div class="grid">${stat('Kalori masuk',fmt(cal)+' kkal','Target '+fmt(db.calorieGoal)+' kkal')}${stat('Protein',sum('protein').toFixed(1)+' g','Total hari ini')}${stat('Karbohidrat',sum('carb').toFixed(1)+' g','Total hari ini')}${stat('Lemak',sum('fat').toFixed(1)+' g','Total hari ini')}</div><div class="card"><div class="between"><b>Progress kalori harian</b><b>${Math.round(cal/db.calorieGoal*100)}%</b></div><div style="height:13px;background:#26344b;border-radius:20px;margin:12px 0"><div style="height:100%;width:${pct}%;background:${cal>db.calorieGoal?'#eaa46e':'linear-gradient(90deg,#6487fa,#8de0bc)'};border-radius:20px"></div></div><div class="between"><span class="muted">${fmt(Math.max(0,db.calorieGoal-cal))} kkal tersisa menuju target</span><label class="field" style="max-width:145px;margin:0">Target (kkal)<input type="number" id="calGoal" value="${db.calorieGoal}" onchange="setGoal()"></label></div></div><div class="two"><div class="card"><h3 class="section">+ Catat makanan</h3><label class="field">Cari makanan Indonesia<input id="foodSearch" placeholder="Contoh: ayam, nasi, telur..." value="${esc(foodSearch)}" oninput="searchFood(this.value)"></label><div style="max-height:205px;overflow:auto;border:1px solid #354761;border-radius:12px;margin-bottom:12px">${filtered.map(o=>`<button style="display:block;text-align:left;width:100%;padding:10px;background:${foodPick===o.i?'#31446c':'#121c30'};color:#eef;border-bottom:1px solid #2a3950" onclick="foodSelect(${o.i})"><b>${esc(o.x[0])}</b><span class="mini"> · ${o.x[1]} kkal/100 g</span></button>`).join('')||'<div class="empty">Tidak ditemukan</div>'}</div><div class="notice"><b>${esc(f[0])}</b><div class="mini">${esc(f[7])} · porsi standar ±${f[5]} g</div></div><div class="two" style="margin-top:12px"><label class="field">Satuan<select onchange="foodChangeUnit(this.value)"><option value="porsi" ${foodUnit==='porsi'?'selected':''}>Porsi (${esc(f[6])})</option><option value="gram" ${foodUnit==='gram'?'selected':''}>Gram (g)</option></select></label><label class="field">Jumlah<input id="foodQty" type="number" min="0.1" step="0.5" value="${foodQty}" oninput="foodQty=+this.value;document.getElementById('foodPreview').textContent=Math.round(${f[1]}*(foodUnit==='gram'?foodQty:foodQty*${f[5]})/100)+' kkal'"></label></div><label class="field">Waktu makan<select onchange="changeMeal(this.value)">${['Sarapan','Makan siang','Makan malam','Snack'].map(x=>`<option ${x===meal?'selected':''}>${x}</option>`).join('')}</select></label><div class="between"><div><div class="metric" id="foodPreview">${Math.round(n[0])} kkal</div><div class="mini">${Math.round(g)} g · P ${n[1].toFixed(1)} g · L ${n[2].toFixed(1)} g · K ${n[3].toFixed(1)} g</div></div><button class="primary" onclick="addFood()">+ Tambah</button></div></div><div class="card"><h3 class="section">Makanan hari ini</h3>${daily.length?['Sarapan','Makan siang','Makan malam','Snack'].map(m=>{let a=daily.filter(x=>x.meal===m);return a.length?`<h4>${m}</h4>${a.map(x=>`<div class="listrow between"><div><b>${esc(x.name)}</b><div class="mini">${Math.round(x.grams)} g · Protein ${Number(x.protein||0).toFixed(1)} g · Karbo ${Number(x.carb||0).toFixed(1)} g · Lemak ${Number(x.fat||0).toFixed(1)} g</div></div><div><b>${Math.round(x.cal)} kkal</b> <button class="danger" onclick="removeFood('${x.id}')">×</button></div></div>`).join('')}`:''}).join(''):'<div class="empty">Belum ada makanan tercatat</div>'}<hr style="border:0;border-top:1px solid #354761"><div class="between"><b>Total gizi harian</b><b>${Math.round(cal)} kkal</b></div><div class="macro-grid"><div class="macro-box"><span class="mini">Kalori</span><b class="macro-k">${Math.round(cal)} kkal</b></div><div class="macro-box"><span class="mini">Protein</span><b class="macro-p">${protein.toFixed(1)} g</b></div><div class="macro-box"><span class="mini">Karbohidrat</span><b class="macro-c">${carb.toFixed(1)} g</b></div><div class="macro-box"><span class="mini">Lemak</span><b class="macro-f">${fat.toFixed(1)} g</b></div></div><details style="margin-top:20px"><summary>Tambah makanan sendiri</summary><p class="mini">Masukkan kalori, protein, karbohidrat, dan lemak per 100 gram</p><label class="field">Nama<input id="newFoodName"></label><div class="three"><label class="field">Kalori<input id="newFoodCal" type="number" value="100"></label><label class="field">Protein (g)<input id="newFoodP" type="number" value="0"></label><label class="field">Lemak (g)<input id="newFoodF" type="number" value="0"></label><label class="field">Karbo (g)<input id="newFoodC" type="number" value="0"></label><label class="field">Gram / porsi<input id="newFoodServing" type="number" value="100"></label></div><button class="secondary" onclick="createFood()">Simpan makanan</button></details></div></div><div class="card"><h3 class="section">Riwayat kalori 7 hari</h3><div style="display:flex;align-items:end;gap:8px;height:155px">${Array.from({length:7},(_,i)=>{let d=new Date(foodDate+'T12:00:00');d.setDate(d.getDate()-(6-i));let k=d.toLocaleDateString('en-CA'),v=db.foodLog.filter(x=>x.date===k).reduce((a,x)=>a+x.cal,0);return `<div style="flex:1;text-align:center"><div class="mini">${v?Math.round(v):''}</div><div style="height:${Math.max(3,Math.min(105,v/db.calorieGoal*105))}px;background:#6487fa;border-radius:7px 7px 0 0"></div><div class="mini">${k.slice(5)}</div></div>`}).join('')}</div></div><p class="mini">Nilai nutrisi adalah estimasi per 100 g bagian yang dimakan. Makanan rumahan (balado, gorengan, telur dadar) bervariasi sesuai resep, minyak yang terserap, dan ukuran porsi. Gunakan timbang matang untuk hasil lebih konsisten. Tidak menghitung kalori olahraga sebagai pengurang otomatis.</p>`}
render();</script></body></html>
